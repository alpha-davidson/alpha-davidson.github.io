<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  {% if page.stylesheet %}
  <link rel="stylesheet" href="{{ page.stylesheet | relative_url }}" />
  {% endif %}
  <link rel="icon" href="/assets/images/favicon.ico" />
</head>

<body>

<header class="site-header">
  <div class="logo-container">
    <a href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="ALPhA Logo" class="site-logo">
    </a>
  </div>
  <nav class="main-nav">
    <ul>
      <li><a href="{{ '/' | relative_url }}">Home</a></li>
      <li><a href="{{ '/members' | relative_url }}">Members</a></li>
      <li><a href="{{ '/news' | relative_url }}">News</a></li>
      <li><a href="{{ '/publications' | relative_url }}">Publications</a></li>
      <li><a href="{{ '/collaborate' | relative_url }}">Collaborate</a></li>
    </ul>
  </nav>
</header>
  <div class="main-container">
    {{ content }}
  </div>

  <footer>
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
  </footer>

</body>
</html>
