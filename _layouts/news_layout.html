---
layout: default
---

<section class="news-container">
  <header class="page-header">
    <h1>ALPhA News</h1>
    <nav class="page-nav">
      <ul>
        <li><a href="#latest">Latest News</a></li>
        <li><a href="#archive">Archive</a></li>
      </ul>
    </nav>
  </header>

  <section id="search">
    <input type="text" id="searchInput" placeholder="Search news...">
    <button id="searchButton">Search</button>
  </section>

  <section id="searchResults" style="display: none;"></section>

  <section id="latest">
    <h2>Latest News</h2>
    <div id="latestNews" class="news-grid"></div>
  </section>

  <section id="archive">
    <h2>News Archive</h2>
    <div id="archiveYears" class="year-buttons"></div>
    <div id="archiveNews" class="news-grid"></div>
  </section>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="{{ '/src/newsData.js' | relative_url }}" type="module"></script>
  <script src="{{ '/src/news.js' | relative_url }}" type="module"></script>
</section>
